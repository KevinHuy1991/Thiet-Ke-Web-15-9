<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Trang đăng ký tài khoản khách hàng - ShopVN">
  <title>Đăng ký tài khoản mới – ShopVN</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f1f5f9;
      color: #334155;
      padding: 25px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* Container */
    main {
      width: 100%;
      max-width: 650px;
    }

    .form-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid #cbd5e1;
    }

    h1 {
      text-align: center;
      font-size: 22px;
      color: #0f172a;
      margin-bottom: 24px;
      font-weight: 700;
    }

    fieldset {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 16px 20px 20px;
      margin-bottom: 20px;
      background: #fafafa;
    }

    legend {
      font-size: 13.5px;
      font-weight: 700;
      color: #1e293b;
      padding: 0 8px;
    }

    .form-group {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    .form-group > label:first-child {
      width: 150px;
      flex-shrink: 0;
      color: #334155;
      font-weight: 500;
    }

    .form-control {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 13px;
      background: #ffffff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15);
    }

    /* Inline groups for radios and checkboxes */
    .inline-options {
      display: flex;
      gap: 16px;
      align-items: center;
      flex: 1;
    }

    .inline-options label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-size: 13px;
    }

    /* Range slider with display value */
    .range-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .range-group input[type="range"] {
      flex: 1;
      cursor: pointer;
    }

    .range-display {
      font-weight: 600;
      color: #0284c7;
      font-size: 13px;
      min-width: 90px;
    }

    /* Color picker input */
    input[type="color"] {
      width: 44px;
      height: 28px;
      padding: 1px 2px;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
    }

    /* Buttons */
    .button-group {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 24px;
    }

    input[type="submit"] {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 8px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    input[type="submit"]:hover {
      background: #0369a1;
    }

    input[type="reset"] {
      background: #64748b;
      color: #ffffff;
      border: none;
      padding: 8px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    input[type="reset"]:hover {
      background: #475569;
    }

    @media (max-width: 600px) {
      .form-group {
        flex-direction: column;
        align-items: flex-start;
      }
      .form-group > label:first-child {
        width: 100%;
        margin-bottom: 4px;
      }
      .form-control, .inline-options, .range-group {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <main>
    <section class="form-container">
      <h1>Đăng ký tài khoản mới</h1>

      <form action="xu_ly_dangky.php" method="POST" enctype="multipart/form-data" name="formDangKy" id="formDangKy">
        <!-- Fieldset 1: Thông tin cơ bản -->
        <fieldset>
          <legend>Thông tin cơ bản</legend>

          <div class="form-group">
            <label for="hoten">Họ và tên:</label>
            <input type="text" name="hoten" id="hoten" class="form-control" placeholder="Nguyễn Văn An" required maxlength="100">
          </div>

          <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" class="form-control" placeholder="example@gmail.com" required>
          </div>

          <div class="form-group">
            <label for="matkhau">Mật khẩu:</label>
            <input type="password" name="matkhau" id="matkhau" class="form-control" minlength="8" required>
          </div>

          <div class="form-group">
            <label for="sdt">Số điện thoại:</label>
            <input type="tel" name="sdt" id="sdt" class="form-control" pattern="[0-9]{10}" placeholder="0901234567">
          </div>
        </fieldset>

        <!-- Fieldset 2: Thông tin cá nhân -->
        <fieldset>
          <legend>Thông tin cá nhân</legend>

          <div class="form-group">
            <label for="tuoi">Tuổi:</label>
            <input type="number" name="tuoi" id="tuoi" class="form-control" min="16" max="99" step="1" value="18">
          </div>

          <div class="form-group">
            <label for="ngaysinh">Ngày sinh:</label>
            <input type="date" name="ngaysinh" id="ngaysinh" class="form-control" min="1950-01-01" max="2010-12-31" value="2005-01-01">
          </div>

          <div class="form-group">
            <label>Giới tính:</label>
            <div class="inline-options">
              <label><input type="radio" name="gioitinh" id="gt_nam" value="nam" checked> Nam</label>
              <label><input type="radio" name="gioitinh" id="gt_nu" value="nu"> Nữ</label>
              <label><input type="radio" name="gioitinh" id="gt_khac" value="khac"> Khác</label>
            </div>
          </div>

          <div class="form-group">
            <label for="mauua">Màu yêu thích:</label>
            <input type="color" name="mauua" id="mauua" value="#FF6B6B">
          </div>
        </fieldset>

        <!-- Fieldset 3: Sở thích & Cài đặt -->
        <fieldset>
          <legend>Sở thích &amp; Cài đặt</legend>

          <div class="form-group">
            <label for="soikim">Tìm kiếm sở thích:</label>
            <input type="search" name="soikim" id="soikim" class="form-control" placeholder="Ví dụ: đọc sách, chơi game...">
          </div>

          <div class="form-group">
            <label for="chitieu">Mức chi tiêu/tháng (VNĐ):</label>
            <div class="range-group">
              <input type="range" name="chitieu" id="chitieu" min="0" max="50000000" step="500000" value="5000000" oninput="document.getElementById('chitieu_val').innerText = Number(this.value).toLocaleString('vi-VN') + ' đ'">
              <span id="chitieu_val" class="range-display">5.000.000 đ</span>
            </div>
          </div>

          <div class="form-group">
            <label>Sở thích (chọn nhiều):</label>
            <div class="inline-options">
              <label><input type="checkbox" name="st_docsinh" id="st_docsinh" value="doc" checked> Đọc sách</label>
              <label><input type="checkbox" name="st_game" id="st_game" value="game" checked> Chơi game</label>
              <label><input type="checkbox" name="st_du_lich" id="st_du_lich" value="dulich"> Du lịch</label>
            </div>
          </div>

          <div class="form-group">
            <label for="website">Website cá nhân:</label>
            <input type="url" name="website" id="website" class="form-control" placeholder="https://example.com">
          </div>

          <div class="form-group">
            <label for="avatar">Ảnh đại diện:</label>
            <input type="file" name="avatar" id="avatar" class="form-control" accept="image/png, image/jpeg">
          </div>
        </fieldset>

        <!-- Nút submit & reset -->
        <div class="button-group">
          <input type="submit" value="Đăng ký ngay">
          <input type="reset" value="Nhập lại">
        </div>
      </form>
    </section>
  </main>

</body>
</html>
